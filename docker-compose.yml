version: '3.8'

services:
  ev-forecasting:
    build: .
    image: ev-charge-forecasting:latest
    container_name: ev-forecasting
    volumes:
      # Mount data directory
      - ./data:/app/data:ro
      # Mount output directories
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      # Mount config (optional override)
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    # Override command as needed
    # Example: command: ["train-all", "--features", "combined"]
