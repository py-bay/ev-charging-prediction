# EV Charge Forecasting Configuration

# Data file paths
data_paths:
  pv: "data/pv_data.csv"
  irradiance: "data/irradiance.csv"
  weather: "data/weather.csv"

# Preprocessing configuration
preprocessing:
  resample_interval: "15T"  # 15-minute intervals
  weather_interp_method: "time"  # Time-based interpolation for weather data
  label_thresholds: [0.5, 0.8, 1.0]  # Multiple threshold options for labeling
  household_consumption_kw: 0.5  # Average household consumption in kW
  train_test_split: 0.8  # 80% train, 20% test
  random_seed: 42  # For reproducibility

# Feature configuration
features:
  sets:
    # Weather features from Open-Meteo
    weather:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - cloud_cover
      - wind_speed_10m
      - wind_gusts_10m
      - pressure_msl
      - weather_code
      - cloud_cover_low
      - cloud_cover_mid
      - cloud_cover_high

    # Irradiance features
    irradiance:
      - irradiance

    # Combined features (weather + irradiance)
    combined:
      - irradiance
      - temperature_2m
      - relative_humidity_2m
      - cloud_cover
      - precipitation
      - wind_speed_10m
      - pressure_msl
      - weather_code

  # Add cyclical time features (hour_sin, hour_cos, day_sin, day_cos)
  cyclical_time_features: true

# Model configuration
models:
  # Enabled models (will be trained with train-all command)
  enabled:
    - randomforest
    - lstm

  # Random Forest hyperparameters
  randomforest:
    n_estimators: 100  # Number of trees
    max_depth: null  # No maximum depth
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1  # Use all CPU cores

  # LSTM hyperparameters
  lstm:
    hidden_size: 64  # LSTM hidden layer size
    num_layers: 2  # Number of LSTM layers
    dropout: 0.2  # Dropout rate
    sequence_length: 12  # Lookback window (12 * 15min = 3 hours)
    batch_size: 32
    epochs: 50
    learning_rate: 0.001
    weight_decay: 0.00001  # L2 regularization
    patience: 10  # Early stopping patience

# Output paths
output_paths:
  models: "outputs/models"
  results: "outputs/results"
  plots: "outputs/plots"
  logs: "logs"
